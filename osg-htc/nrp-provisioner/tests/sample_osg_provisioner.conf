# Sample provisioner config for the tests, modeled on the osg-icecube one. The startup check in
# image.sh uses it for real (read-only) queries to the OSPool and IceCube's schedd.
[DEFAULT]
apptainer=no
k8s_domain=nrp-nautilus.io
app_name=osg-direct
force_k8s_namespace_matching=no
additional_requirements=Group=?="IceCube"&&RequestGPUs=?=1&&(ProjectName=?="IceCube")

[htcondor]
schedd_whitelist_regexp=(.*sub.*\.icecube\.wisc\.edu)

[k8s]
k8s_image=hub.opensciencegrid.org/osg-htc/nrp-ospool-ep:25-release
tolerations_list=nautilus.io/noceph
node_affinity_dict=^nautilus.io/low-power:true,nvidia.com/gpu.product:NVIDIA-A10|NVIDIA-GeForce-RTX-3090
priority_class=opportunistic
max_submit_pods_per_cluster=300
k8s_job_ttl=7200
use_large_limit=no
service_account_name=prp-htcondor-wn-ro
envs_dict=GLIDEIN_Site:SDSC-PRP,GLIDEIN_ResourceName:SDSC-PRP-OSPool-Provisioner
annotations_dict=container.apparmor.security.beta.kubernetes.io/htcondor:unconfined
labels_dict=applicationId:osg-test-wn
